<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 374" width="1120" height="374" role="img" aria-label="measure, then interview, then verdict — and the verdict is refused until the interview is answered">
<title>measure, then interview, then verdict — and the verdict is refused until the interview is answered</title>
<rect width="1120" height="374" fill="#0b1315"/>
<text x="560" y="44" font-family="Georgia,'Hiragino Mincho ProN','Yu Mincho',serif" font-size="20" fill="#e3ecea" text-anchor="middle" font-weight="700">Measuring is the easy half</text>
<rect x="0" y="80" width="320" height="150" fill="#101b1d" stroke="#26383c"/>
<rect x="0" y="80" width="4" height="150" fill="#9db0ad"/>
<text x="22" y="114" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="13" fill="#9db0ad" text-anchor="start" font-weight="400" letter-spacing="1.5">1  MEASURE</text>
<text x="22" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="12" fill="#6e8380" text-anchor="start" font-weight="400">a date window</text>
<text x="22" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#e3ecea" text-anchor="start" font-weight="400">Reads only what you typed. Counts six</text>
<text x="22" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#e3ecea" text-anchor="start" font-weight="400">types&#x27; signals.</text>
<path d="M328 155 L350 155" stroke="#26383c" stroke-width="1.5"/>
<path d="M352 155 l-7 -5 l0 10 Z" fill="#26383c"/>
<rect x="360" y="80" width="320" height="150" fill="#101b1d" stroke="#26383c"/>
<rect x="360" y="80" width="4" height="150" fill="#9db0ad"/>
<text x="382" y="114" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="13" fill="#9db0ad" text-anchor="start" font-weight="400" letter-spacing="1.5">2  INTERVIEW</text>
<text x="382" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="12" fill="#6e8380" text-anchor="start" font-weight="400">what the numbers cannot settle</text>
<text x="382" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#e3ecea" text-anchor="start" font-weight="400">Was this quote yours? Is that zero an</text>
<text x="382" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#e3ecea" text-anchor="start" font-weight="400">inability, or no occasion?</text>
<path d="M688 155 L710 155" stroke="#26383c" stroke-width="1.5"/>
<path d="M712 155 l-7 -5 l0 10 Z" fill="#26383c"/>
<rect x="720" y="80" width="320" height="150" fill="#101b1d" stroke="#26383c"/>
<rect x="720" y="80" width="4" height="150" fill="#4fc2cc"/>
<text x="742" y="114" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="13" fill="#4fc2cc" text-anchor="start" font-weight="400" letter-spacing="1.5">3  VERDICT</text>
<text x="742" y="138" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="12" fill="#6e8380" text-anchor="start" font-weight="400">only once they are answered</text>
<text x="742" y="168" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#e3ecea" text-anchor="start" font-weight="400">Names the type, on evidence you</text>
<text x="742" y="187" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#e3ecea" text-anchor="start" font-weight="400">confirmed.</text>
<rect x="0" y="270" width="1120" height="88" fill="#101b1d" stroke="#d9765c"/>
<text x="24" y="296" font-family="ui-monospace,'Cascadia Mono',Consolas,monospace" font-size="13" fill="#d9765c" text-anchor="start" font-weight="400" letter-spacing="1.5">NO VERDICT</text>
<text x="24" y="320" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#9db0ad" text-anchor="start" font-weight="400">Until every blocking question is answered, `verdict` refuses. Saying &quot;no, I pasted that&quot; revokes the</text>
<text x="24" y="340" font-family="system-ui,-apple-system,'Segoe UI',Roboto,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif" font-size="13" fill="#9db0ad" text-anchor="start" font-weight="400">quote — and if that drops a type below the two quotes a verdict needs, the verdict goes too.</text>
</svg>
